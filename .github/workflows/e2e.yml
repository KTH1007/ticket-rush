name: e2e

# 앱 전체를 실제 HTTP로 거치는 시나리오 테스트다. 컨테이너와 앱을 따로 띄워 느려서 매 PR에는 돌리지 않는다.
# main 병합과 야간에 돌리고, e2e 테스트나 이 파일을 고친 PR에서만 PR에도 돌린다.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "src/test/kotlin/com/ticketrush/e2e/**"
  schedule:
    - cron: "30 18 * * *" # UTC 18시 30분 = KST 새벽 3시 30분. 동시성 테스트와 겹치지 않게 어긋나 있다
  workflow_dispatch: # 필요할 때 수동 실행

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Testcontainers는 ubuntu-latest에 Docker가 있어 그대로 돈다
      - name: e2e test
        run: ./gradlew e2eTest --no-daemon
        env:
          PHONE_HMAC_KEY: ci-only-key-not-a-real-secret
          TESTCONTAINERS_REUSE_ENABLE: "false" # CI는 매번 새 러너라 재사용 불가

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: build/reports/tests/e2eTest/
          retention-days: 14
