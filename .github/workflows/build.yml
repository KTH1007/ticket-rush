name: build

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  # 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다. 러너 시간 절약
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 컴파일, 테스트, detekt, ktlint, 모듈 경계 검증이 전부 여기 물려 있다.
      # Testcontainers는 ubuntu-latest에 Docker가 있어 그대로 돈다.
      # 동시성 테스트는 @Tag로 제외돼 여기서 돌지 않는다.
      - name: build
        run: ./gradlew build --no-daemon
        env:
          PHONE_HMAC_KEY: ci-only-key-not-a-real-secret
          TESTCONTAINERS_REUSE_ENABLE: "false" # CI는 매번 새 러너라 재사용 불가

      - name: upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/reports/detekt/
            build/reports/ktlint/
          retention-days: 7

      # 모듈 구조 문서를 산출물로 남긴다.
      # PR에서 모듈 경계가 어떻게 바뀌었는지 그림으로 확인할 수 있다.
      - name: upload module docs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: modulith-docs
          path: build/spring-modulith-docs/
          retention-days: 7

      # REST Docs HTML + openapi3 스펙 + 정적 Swagger UI를 한 폴더로 모아
      # GitHub Pages 배포 잡으로 넘긴다. Docker 이미지는 문서를 안 담기로 했으니
      # 팀원이 로컬 빌드 없이 볼 수 있는 경로는 이것뿐이다.
      - name: assemble docs site
        if: success()
        run: |
          mkdir -p docs-site
          cp build/docs/asciidoc/index.html docs-site/
          cp build/api-spec/openapi3.yaml docs-site/
          cp src/docs/swagger.html docs-site/

      - name: upload docs site
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs-site/
          retention-days: 7

  # main에 머지된 것만 배포한다. PR 브랜치 문서까지 공개 URL에 올릴 필요는 없다.
  deploy-docs:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: docs-site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

      - id: deployment
        uses: actions/deploy-pages@v4
