version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 개별 PR이 쏟아지면 안 보게 된다. 묶어서 하나로 받는다
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["io.mockk*", "org.testcontainers*", "com.tngtech.archunit*", "com.redis*"]
      # kotlin과 detekt는 서로 컴파일된 Kotlin 버전이 맞아야 한다. 어느 한쪽만
      # 올라오면 "detekt was compiled with Kotlin X but is currently running
      # with Y"로 깨진다. 실제로 겪은 문제라 묶어서 항상 같이 받는다
      kotlin-toolchain:
        patterns: ["org.jetbrains.kotlin*", "dev.detekt*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  # docker-compose.yml의 이미지 버전은 docker ecosystem이 스캔하지 않는다. 별도 ecosystem 필요
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

