# 부하 측정 전용 환경. 개발용 스택(docker-compose.yml)과 이름과 포트가 겹치지 않아 같이 떠 있어도 된다.
# 프로젝트명이 tr-measure이고 container_name을 쓰지 않으며, 앱은 18080 한 곳으로만 연다.
#
# 앱을 2코어와 1GiB로 묶은 이유: k6가 같은 머신에서 CPU를 나눠 쓰면 서버가 아니라 부하기가 먼저 포화돼
# 서버 용량을 못 본다. 서버를 작게 묶어 서버가 먼저 한계에 닿게 하고, 결과를 "2코어 앱 1대의 용량"으로 읽는다.
#
# 실행: PHONE_HMAC_KEY=... PHONE_ENCRYPTION_KEY=... docker compose -f k6/docker-compose.measure.yml up -d --build
# 보통은 k6/measure-queue.sh가 키 생성부터 정리까지 한다.

name: tr-measure

services:
  postgres:
    image: postgres:18-alpine
    mem_limit: 1g
    cpus: 2
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: measurepw
    command: [postgres, -c, max_connections=200]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:13-alpine
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../src/main/resources/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/ticketrush
      - -user=ticketrush
      - -password=measurepw
      - -connectRetries=10
      - migrate

  redis:
    image: redis:8-alpine
    mem_limit: 1g
    cpus: 1
    # 운영 compose와 같은 설정이다. 50만 명이 이 한도에 들어가는지도 측정 대상이다
    command: [redis-server, --maxmemory, 512mb, --maxmemory-policy, noeviction, --appendonly, "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      flyway: { condition: service_completed_successfully }
    mem_limit: 1g
    # 기본 2코어. 승격 200/s 위에서 DB가 먼저 닿게 하려고 D2 단계에서만 늘린다(앱 CPU가 먼저 포화되기 때문)
    cpus: ${APP_CPUS:-2}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 측정용 구성이라 PG를 명시한다(기본 가짜). 프로필에는 기본값을 두지 않는다
      TICKET_RUSH_PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      # toss일 때만 쓰인다. PG 장애 모드는 호스트의 k6/toss-stub.py로 흉내 낸다
      TICKET_RUSH_TOSS_BASE_URL: ${TOSS_BASE_URL:-https://api.tosspayments.com}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TICKET_RUSH_SEAT_HOLD_TTL: ${SEAT_HOLD_TTL:-5m}
      TICKET_RUSH_SEAT_PAYMENT_FAILED_HOLD_TTL: ${SEAT_PAYMENT_FAILED_HOLD_TTL:-1m}
      INSTANCE_ID: measure-1
      DB_PASSWORD: measurepw
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      # 측정이 15분을 넘어도 미리 등록한 토큰이 만료되지 않게 한다
      TICKET_RUSH_QUEUE_TOKEN_TTL: ${QUEUE_TOKEN_TTL:-2h}
      TICKET_RUSH_QUEUE_POLL_INTERVAL_FAR_MAX: ${QUEUE_POLL_FAR_MAX:-5m}
      # 기본은 승격을 끄고(1h) 등록과 폴링만 잰다. 승격이 도는 상황은 1s로 다시 띄워 잰다
      TICKET_RUSH_QUEUE_PROMOTION_INTERVAL: ${QUEUE_PROMOTION_INTERVAL:-1h}
      # 초당 승격 인원. 홀드와 결제가 DB로 오는 속도를 정한다(D1에서 50, 100, 200으로 바꿔 잼)
      TICKET_RUSH_QUEUE_PROMOTION_BUDGET_PER_SECOND: ${QUEUE_PROMOTION_BUDGET:-100}
      # 진단용으로 JVM 옵션을 덧붙이는 통로(예: GC 로그). 이미지의 JAVA_TOOL_OPTIONS는 그대로 두고 이 값이 뒤에 붙는다
      JDK_JAVA_OPTIONS: ${MEASURE_JAVA_OPTS:-}
      TICKET_RUSH_PAYMENT_FAKE_DELAY: ${PG_DELAY:-0ms}
      # 측정은 한 컨테이너에서 전 부하가 나가 IP 기준 한도에 걸리므로 올린다. IP 카운터의 Redis 호출은 그대로 측정에 들어간다
      TICKET_RUSH_QUEUE_REGISTER_LIMIT_MAX_PER_IP: ${REGISTER_LIMIT_MAX_PER_IP:-1000000}
      TICKET_RUSH_RESERVATION_LOOKUP_IP_MAX_ATTEMPTS: ${LOOKUP_IP_MAX_ATTEMPTS:-1000000}
    # 부하는 nginx(18080)로 보내고, 이 포트는 헬스와 지표 조회, 앱을 직접 칠 때만 쓴다
    ports:
      - "127.0.0.1:18081:8080"

  # 앱 2대 구성(A2 단계)에서만 쓴다. --profile two 또는 COMPOSE_PROFILES=two로 켠다
  app2:
    profiles: ["two"]
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      flyway: { condition: service_completed_successfully }
    mem_limit: 1g
    cpus: ${APP_CPUS:-2}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TICKET_RUSH_PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      # toss일 때만 쓰인다. PG 장애 모드는 호스트의 k6/toss-stub.py로 흉내 낸다
      TICKET_RUSH_TOSS_BASE_URL: ${TOSS_BASE_URL:-https://api.tosspayments.com}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TICKET_RUSH_SEAT_HOLD_TTL: ${SEAT_HOLD_TTL:-5m}
      TICKET_RUSH_SEAT_PAYMENT_FAILED_HOLD_TTL: ${SEAT_PAYMENT_FAILED_HOLD_TTL:-1m}
      INSTANCE_ID: measure-2
      DB_PASSWORD: measurepw
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      TICKET_RUSH_QUEUE_TOKEN_TTL: ${QUEUE_TOKEN_TTL:-2h}
      TICKET_RUSH_QUEUE_POLL_INTERVAL_FAR_MAX: ${QUEUE_POLL_FAR_MAX:-5m}
      TICKET_RUSH_QUEUE_PROMOTION_INTERVAL: ${QUEUE_PROMOTION_INTERVAL:-1h}
      TICKET_RUSH_QUEUE_PROMOTION_BUDGET_PER_SECOND: ${QUEUE_PROMOTION_BUDGET:-100}
      JDK_JAVA_OPTIONS: ${MEASURE_JAVA_OPTS:-}
      TICKET_RUSH_PAYMENT_FAKE_DELAY: ${PG_DELAY:-0ms}
      TICKET_RUSH_QUEUE_REGISTER_LIMIT_MAX_PER_IP: ${REGISTER_LIMIT_MAX_PER_IP:-1000000}
      TICKET_RUSH_RESERVATION_LOOKUP_IP_MAX_ATTEMPTS: ${LOOKUP_IP_MAX_ATTEMPTS:-1000000}
    ports:
      - "127.0.0.1:18082:8080"

  # 운영과 같은 docker/nginx/nginx.conf를 쓴다. 앱이 1대라 upstream 조각만 다르다.
  # 줄서기 상한 숫자를 바꿔 비교할 때는 러너가 그 한 줄만 바꾼 복사본을 NGINX_CONF로 넘긴다
  nginx:
    image: nginx:1.31-alpine
    depends_on:
      - app
    volumes:
      - ${NGINX_CONF:-../docker/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${NGINX_UPSTREAM:-./nginx-upstream-1.conf}:/etc/nginx/upstream.conf:ro
    ports:
      - "127.0.0.1:18080:80"
