global:
  scrape_interval: 5s        # 부하테스트 구간을 보려면 기본 15초로는 거칠다

scrape_configs:
  - job_name: ticket-rush
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { instance_name: local }
      # 8단계에서 주석을 푼다
      # - targets: ["app-1:8080"]
      #   labels: { instance_name: app-1 }
      # - targets: ["app-2:8080"]
      #   labels: { instance_name: app-2 }
