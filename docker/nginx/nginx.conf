worker_processes auto;   # 기본값 1이면 한 코어가 초당 8,000~12,000건에서 포화된다
events { worker_connections 4096; }

http {
    # 서버 목록은 환경마다 달라서 조각 파일로 분리했다 (upstream-2.conf는 앱 2대, k6/nginx-upstream-1.conf는 측정용 1대)
    upstream app {
        include /etc/nginx/upstream.conf;
        keepalive 64;
    }

    # 느린 요청(100ms 이상)과 서버 오류(500, 502, 504)만 표준 출력에 JSON 한 줄로 남긴다. 전부 남기면 폭주 때 로그 쓰기가 부하가 된다.
    # id는 앱 로그의 traceId와 같다(아래 X-Request-Id). upstream_time이 "-"면 nginx가 직접 답한 요청이다
    log_format slow escape=json '{"time":"$time_iso8601","id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time","upstream_header_time":"$upstream_header_time","upstream_connect_time":"$upstream_connect_time","bytes":$bytes_sent,"cache":"$upstream_cache_status"}';
    map $request_time $slow_request {
        ~^0\.0 0;
        default 1;
    }
    map $status $server_error {
        500 1;
        502 1;
        504 1;
        default 0;
    }
    map "$slow_request$server_error" $log_request {
        "00" 0;
        default 1;
    }
    access_log /dev/stdout slow if=$log_request;

    # 좌석 배치는 응답이 커서 새 사용자마다 앱이 내보내면 앱 CPU를 많이 쓰므로 nginx가 캐시해서 내보낸다.
    # 캐시 시간은 앱이 주는 Cache-Control(max-age)을 따르고, Accept-Encoding별 응답(gzip과 원본)은 앱의 Vary 헤더대로 따로 둔다
    proxy_cache_path /var/cache/nginx/seat-layout levels=1:2 keys_zone=seat_layout:1m max_size=64m inactive=10m use_temp_path=off;

    # 줄서기(POST)와 순번 조회(GET)를 따로 센다. 순서가 정해지는 줄서기는 상한을 높게 두고, 순번이 이미 정해진 조회는 낮게 둔다.
    # 키가 빈 문자열이면 세지 않으므로 홀드와 결제는 제한하지 않는다. $server_name은 server_name을 안 쓰면 빈 문자열이라 고정 문자열을 쓴다
    map $uri $register_key {
        ~^/api/events/[^/]+/queues$ "register";
        default "";
    }
    map $uri $poll_key {
        ~^/api/events/[^/]+/queues/me$ "poll";
        default "";
    }
    # 거절된 요청이 같은 순간에 돌아오지 않게 Retry-After를 3 ~ 10초로 흩뜨린다(요청 id의 마지막 글자)
    map $request_id $retry_after {
        ~[0-3]$ 3;
        ~[4-7]$ 5;
        ~[89ab]$ 7;
        default 10;
    }
    limit_conn_zone $register_key zone=queue_register:1m;
    limit_conn_zone $poll_key zone=queue_poll:1m;
    limit_conn_status 503;
    # 거절마다 error 로그를 남기면 폭주 때 로그 쓰기가 부하가 되므로 기본 수준(error) 아래로 낮춘다
    limit_conn_log_level info;

    server {
        listen 80;

        # Prometheus는 Docker 내부에서 app-1:8080, app-2:8080으로 직접 수집한다.
        # 외부 클라이언트에는 관리 엔드포인트를 공개하지 않는다.
        location ^~ /actuator/ {
            return 404;
        }

        location ~ ^/api/events/[^/]+/seats/layout$ {
            proxy_cache seat_layout;
            # 캐시가 비었거나 만료됐을 때 몰린 요청이 모두 앱으로 가지 않게 하나만 보내고 나머지는 기다린다
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            # 만료된 사본을 주면서 뒤에서 갱신하고, 앱이 잠시 안 돼도 이전 배치를 준다(배치는 거의 안 바뀌는 데이터다)
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Request-Id $request_id always;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error;
        }

        location / {
            # 동시 처리가 많아지면 앱 힙이 먼저 차서 죽는다. nginx 하나가 세는 합계라 앱 사양에 맞춰 정한다(2코어, 힙 512MiB 기준)
            limit_conn queue_register 500;
            limit_conn queue_poll 250;
            error_page 503 = @busy;
            add_header X-Request-Id $request_id always;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            # 앞에 다른 프록시가 없는 엣지라 클라이언트가 보낸 값을 버리고 접속 IP로 덮어쓴다(앞에 로드밸런서가 생기면 realip 설정으로 바꾼다)
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # 과부하일 때 timeout 재시도가 요청을 늘리지 않게 연결 실패에만 다른 앱으로 넘긴다
            proxy_next_upstream error;
        }

        # nginx가 직접 만든 503만 여기로 온다. 본문은 앱의 ProblemDetail 형식(title, status, detail, code)에 맞췄다
        location @busy {
            default_type application/problem+json;
            add_header Retry-After $retry_after always;
            add_header X-Request-Id $request_id always;
            return 503 '{"title":"Service Unavailable","status":503,"detail":"접속자가 많아 잠시 후 다시 시도합니다","code":"SERVER_BUSY"}';
        }
    }
}
