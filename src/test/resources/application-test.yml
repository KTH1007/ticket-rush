spring:
  flyway:
    enabled: true   # 테스트는 인스턴스가 하나라 겹치지 않는다
    # 프로필별 locations는 기본값을 덮어쓴다(병합 안 됨). 그래서 db/migration을
    # 명시적으로 다시 포함시켜야 실제 도메인 마이그레이션도 계속 적용된다.
    locations: classpath:db/migration,classpath:db/testmigration
  threads:
    virtual: { enabled: false }   # 테스트는 결정적으로 돌아야 한다
  datasource:
    hikari:
      minimum-idle: 2   # 캐시된 컨텍스트마다 풀이 최대치(20)를 미리 쥐면 컨텍스트가 늘 때 DB 연결 한도를 넘는다

ticket-rush:
  seat:
    hold-expiry-interval: 1h   # 캐시된 컨텍스트의 스위퍼가 같은 DB에서 돌아 테스트에 끼지 않게 한다. 스위퍼 테스트는 sweep()을 직접 부른다
  reservation-lookup:
    ip-max-attempts: 1000000   # 같은 IP로 실패하는 테스트가 많고 Redis가 테스트 간에 공유된다. 한도 테스트는 작은 한도의 어댑터를 따로 만든다
  queue:
    poll-interval: { jitter-ratio: 0.0 }   # 지터를 끈다
    # 캐시된 컨텍스트의 스케줄러가 같은 Redis의 대기열과 초당 예산을 같이 써서 테스트가 흔들린다. 승격은 테스트가 직접 부른다
    promotion-interval: 1h
    promotion-budget-per-second: 100000   # 일반 테스트가 같은 초에 몰려 승격해도 예산에 걸리지 않게 한다. 예산 테스트는 따로 만든 어댑터를 쓴다
    broadcast-cache-ttl: 0s
    register-limit: { max-per-ip: 1000000 }   # 테스트가 같은 IP로 토큰을 많이 만들고 Redis가 테스트 간에 공유된다. 한도 테스트는 작은 한도의 어댑터를 따로 만든다
  seat-map:
    # 캐시된 컨텍스트의 갱신이 테스트 중에 끼어들지 않게 한다. 갱신은 테스트가 직접 부르고, 허용 시간은 갱신 주기보다 짧을 수 없다
    status-refresh-interval: 1h
    status-max-stale: 1h
  outbox:
    poll-interval: 100ms
    chunk-size: 10
    retry-delay: 200ms
    stale-claim-timeout: 500ms
    reclaim-interval: 200ms
  payment:
    gateway: fake   # 설정이 없으면 기동이 실패한다. 테스트는 가짜 PG로 돈다
    stale-claim-timeout: 500ms
    # 캐시된 컨텍스트의 틱이 다른 테스트가 커밋한 PENDING 행을 가로채지 않게 늘린다. 스케줄러 테스트는 reclaim(staleBefore)를 직접 부른다
    reclaim-interval: 1h
    # 캐시된 컨텍스트의 틱이 다른 테스트가 커밋해 둔 CANCELED 행을 집어가지 않게 끈다. 스케줄러 테스트는 retry(staleBefore)를 직접 부른다
    refund-retry-interval: 2h   # 회수 주기와 값을 다르게 둬서, 두 설정이 섞이지 않았는지 설정 테스트가 구분하게 한다
    refund-retry-delay: 1h
    refund-backlog-refresh-interval: 1h   # 캐시된 컨텍스트의 갱신이 테스트 중에 끼지 않게 한다. 갱신은 테스트가 직접 부른다
  toss:
    base-url: http://localhost:0
    secret-key: test-secret-key
  security:
    phone-hmac-key: test-hmac-key-for-local-only
    phone-encryption-key: dGVzdC1waG9uZS1lbmNyeXB0aW9uLWtleS0zMmJ5dGU=
