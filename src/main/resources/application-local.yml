spring:
  config:
    # 앱은 .env를 자동으로 읽지 않아서 로컬 실행에서는 여기서 불러온다. 작업 디렉터리가 프로젝트 루트여야 한다
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: localpassword
  data:
    redis: { host: localhost, port: 6379 }
  jpa:
    properties: { hibernate: { format_sql: true } }

ticket-rush:
  payment:
    gateway: fake   # 로컬 개발 기본. Toss로 시험하려면 환경 변수 TICKET_RUSH_PAYMENT_GATEWAY=toss

logging:
  level:
    com.ticketrush: DEBUG
    org.hibernate.SQL: DEBUG
